# Defaults are for local development only. Real values come from environment variables (.env.example).
spring:
  application:
    name: fooddash
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/fooddash}
    username: ${DATABASE_USER:fooddash}
    password: ${DATABASE_PASSWORD:fooddash}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fooddash:
  payment:
    provider: ${PAYMENT_PROVIDER:fake} # fake | wallet
  wallet:
    base-url: ${WALLET_BASE_URL:https://wallet.example/api}
    api-key: ${WALLET_API_KEY:}
  demo:
    customer-id: c0000000-0000-4000-8000-000000000001 # until sign-in (Class 10)

sms:
  api-key: smsbd_live_9f2c7a1e4b6d8f0a3c5e7b9d
